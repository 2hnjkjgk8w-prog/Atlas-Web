
name: Actualiser Atlas Web

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: atlas-web-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Lancer le collecteur
        run: python collector.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sources.json data/articles.json

          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique des données"
            git push
          else
            echo "Aucune modification à enregistrer."
          fi
